[package]
name = "yscope-linter"
version = "0.1.0"
edition = "2024"
description = "Lints the y-scope Rust comment and docstring rules that rustfmt and clippy can't check"
license = "Apache-2.0"
publish = false

[dependencies]
clap = { version = "4.6.8", features = ["derive"] }
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
quote = "1.0.47"
syn = {
  version = "3.0.10",
  default-features = false,
  features = [
    "full",
    "parsing",
    "printing",
    "visit",
  ]
}
