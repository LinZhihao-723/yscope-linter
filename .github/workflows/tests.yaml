name: "tests"

on:
  pull_request:
  push:
  schedule:
    # Run daily at 00:15 UTC (the 15 is to avoid periods of high load)
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: "${{github.workflow}}-${{github.ref}}"

  # Cancel in-progress jobs for efficiency
  cancel-in-progress: true

jobs:
  rust-tests:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        with:
          submodules: "recursive"

      - uses: "./tools/yscope-dev-utils/exports/github/actions/install-go-task"

      - if: "hashFiles('Cargo.toml') != ''"
        uses: "dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc"  # master
        with:
          toolchain: "stable"

      - if: "hashFiles('Cargo.toml') != ''"
        uses: "taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f"  # v2.90.6
        with:
          tool: "cargo-nextest"

      - if: "hashFiles('Cargo.toml') != ''"
        run: "task test:rust"
